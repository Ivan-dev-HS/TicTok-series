name: Rescatar vídeo

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Id de la ejecución de la que recuperar el vídeo"
        required: true
      nombre:
        description: "Nombre del artefacto"
        default: demo

permissions:
  contents: write
  actions: read

jobs:
  rescatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.nombre }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: _rescate
      - name: Guardar en videos/
        run: |
          mkdir -p videos
          i=1; for f in $(find _rescate -name '*.mp4'); do
            n="videos/${{ inputs.nombre }}-${{ inputs.run_id }}"; [ $i -gt 1 ] && n="$n-$i"; cp "$f" "$n.mp4"; i=$((i+1))
          done
          ls -la videos
          git config user.name "estudio-bot"
          git config user.email "estudio-bot@users.noreply.github.com"
          git add videos && git commit -q -m "vídeo rescatado de la ejecución ${{ inputs.run_id }}" && git push -q
