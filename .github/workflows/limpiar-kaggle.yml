name: Limpiar Kaggle

on:
  workflow_dispatch:

jobs:
  limpiar:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - run: pip install -q kaggle
      - name: Borrar cuaderno y datos
        run: |
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY
          [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          k=$(kaggle kernels delete -y "$KAGGLE_USERNAME/estudio-animador" 2>&1 | tail -1)
          d=$(kaggle datasets delete -y "$KAGGLE_USERNAME/estudio-trabajo" 2>&1 | tail -1)
          echo "::notice title=Cuaderno::$k"
          echo "::notice title=Datos::$d"
